project_name:
  type: str 
  help: The name of your next copier-template. #If using 'uvx example, it should be example_project' TODO: hardcode this
  default: example_project

your_name:
  type: str
  help: Your first and last name.
  default: Some User

github_repo:
  type: str
  help: Your github repo in the style of 'user/repo' without https://github.com/ 

_subdirectory: template
_answers_file: .copier-answers.yml
_tasks:
  - "uv sync" #TODO: remove later
  #- "uvx copier-template repair" 
_exclude:
  - "pyproject.toml"
  - ".venv"
  - ".cache"
  - ".ruff_cache"
  - ".pytest_cache"
  - ".skylos"
  - "__pycache__"
  - "*.egg-info"
  - "*.py[co]"
  - "~*"
  - "*.bar"
  - ".env*"
  - ".terraform"
  - ".terraformrc"
  - "terraform.rc"
  - "*.tfstate"
  - "*.tfstate.*"
  - "*.tfplan"
  - "*.tfvars"
  - "*.tfvars.json"
  - "crash.log"
  - "crash.*.log"
  - "override.tf"
  - "override.tf.json"
  - "*_override.tf"
  - "*_override.tf.json"
