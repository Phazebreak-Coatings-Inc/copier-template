_subdirectory: template
_answers_file: .copier-template-answers.yml
_tasks:
  - "uvx {{project_name}} repair" 
_exclude:
  - ".git"
  - ".gitignore"
  - ".venv"
  - ".cache"
  - ".ruff_cache"
  - ".pytest_cache"
  - ".skylos"
  - "__pycache__"
  - "*.egg-info"
  - "*.py[co]"
  - "~*"
  - "*.bar"
  - ".env*"
  - ".terraform"
  - ".terraformrc"
  - "terraform.rc"
  - "*.tfstate"
  - "*.tfstate.*"
  - "*.tfplan"
  - "*.tfvars"
  - "*.tfvars.json"
  - "crash.log"
  - "crash.*.log"
  - "override.tf"
  - "override.tf.json"
  - "*_override.tf"
  - "*_override.tf.json"
